name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'
          cache: true

      - name: Setup Android project
        run: |
          set -e
          flutter create --org com.andrux --project-name float_window_project --platforms=android .
          MANIFEST=android/app/src/main/AndroidManifest.xml

          # permissions
          grep -q SYSTEM_ALERT_WINDOW "$MANIFEST" || sed -i 's/<application/<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"\/>\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"

          sed -i 's/android:label="[^"]*"/android:label="悬浮窗项目"/' "$MANIFEST"

          # inject OverlayService before </application>
          if ! grep -q OverlayService "$MANIFEST"; then
            sed -i 's|</application>|        <service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="interactive floating panel"/></service>\n    </application>|' "$MANIFEST"
          fi

          echo "MANIFEST:"
          cat "$MANIFEST"

          GRADLE=android/app/build.gradle.kts
          if [ -f "$GRADLE" ]; then
            grep -q ndkVersion "$GRADLE" || sed -i 's/android {/android {\n    ndkVersion = "27.0.12077973"/' "$GRADLE"
            sed -i 's/applicationId = ".*"/applicationId = "com.andrux.floatwindow"/' "$GRADLE"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
