name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'
          cache: true

      - name: Setup Android project
        run: |
          flutter create --org com.andrux --project-name float_window_project --platforms=android .
          MANIFEST=android/app/src/main/AndroidManifest.xml

          # Permissions before <application>
          if ! grep -q 'SYSTEM_ALERT_WINDOW' "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"\/>\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi

          # App label
          sed -i 's/android:label="[^"]*"/android:label="悬浮窗项目"/' "$MANIFEST"

          # Critical: OverlayService inside <application>
          if ! grep -q 'flutter_overlay_window.OverlayService' "$MANIFEST"; then
            python3 << 'PY'
from pathlib import Path
p = Path("android/app/src/main/AndroidManifest.xml")
t = p.read_text()
service = '''
        <service
            android:name="flutter.overlay.window.flutter_overlay_window.OverlayService"
            android:exported="false"
            android:foregroundServiceType="specialUse">
            <property
                android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                android:value="显示可交互的 Material 悬浮窗面板"/>
        </service>
'''
            # insert before closing </application>
            if "</application>" in t and "OverlayService" not in t:
                t = t.replace("</application>", service + "\n    </application>")
                p.write_text(t)
                print("service injected")
            else:
                print("skip inject", "OverlayService" in t)
PY
          fi
          echo "----- MANIFEST -----"
          cat "$MANIFEST"

          GRADLE=android/app/build.gradle.kts
          if [ -f "$GRADLE" ]; then
            if ! grep -q 'ndkVersion' "$GRADLE"; then
              sed -i 's/android {/android {\n    ndkVersion = "27.0.12077973"/' "$GRADLE"
            fi
            sed -i 's/applicationId = ".*"/applicationId = "com.andrux.floatwindow"/' "$GRADLE"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
